name: InstaSave CI/CD Quality Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-openapi-spec:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate API_SPEC.yaml
        run: |
          pip install openapi-spec-validator pyyaml
          python -m openapi_spec_validator API_SPEC.yaml

  backend-quality:
    name: FastAPI Quality & Test Gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pytest
      - name: Run Ruff Linter
        run: python -m ruff check backend/ --ignore E501
      - name: Run Ruff Formatter Check
        run: python -m ruff format --check backend/
      - name: Run PyTest Suite
        run: python -m pytest

  android-build-and-lint:
    name: Android Build & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
