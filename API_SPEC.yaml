openapi: 3.1.0
info:
  title: InstaSave Backend API
  version: 1.0.0
  description: >
    Source of truth for the InstaSave Android client's generated Kotlin/Retrofit
    client. See ARCHITECTURE.md §2a. Do not hand-edit generated client code —
    edit this file and regenerate. v1 scope is public Instagram content only;
    LOGIN_REQUIRED is a normal, expected response, not a bug.

servers:
  - url: https://your-space.hf.space
    description: Hugging Face Spaces deployment

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  ytDlpVersion: { type: string, example: "2025.12.08" }

  /api/resolve:
    post:
      operationId: resolveMedia
      summary: Resolve an Instagram URL into media metadata and available renditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://www.instagram.com/reel/AbCdEfGhIj/"
      responses:
        "200":
          description: Successfully resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInfo"
        "400":
          description: Invalid or non-Instagram URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Content requires a login session (v1 has none) — expected, not exceptional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate-limited by Instagram; client should back off and retry
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Content not found or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    MediaFormat:
      type: object
      required: [formatId, label, ext]
      properties:
        formatId: { type: string, example: "1080p" }
        label: { type: string, example: "1080p" }
        ext: { type: string, example: "mp4" }
        vcodec: { type: string, nullable: true, example: "avc1" }
        acodec: { type: string, nullable: true, example: "aac" }
        height: { type: integer, nullable: true, example: 1080 }
        width: { type: integer, nullable: true, example: 1080 }
        tbr: { type: number, nullable: true, description: "bitrate, kbps" }
        filesizeBytes: { type: integer, nullable: true, example: 25800000 }

    CarouselItem:
      type: object
      required: [index, type, formats]
      properties:
        index: { type: integer }
        type: { type: string, enum: [photo, video] }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        formats:
          type: array
          items: { $ref: "#/components/schemas/MediaFormat" }

    MediaInfo:
      type: object
      required: [id, type]
      properties:
        id: { type: string, description: "Instagram shortcode" }
        type:
          type: string
          enum: [post, reel, carousel]
          description: "v1 supports these three; story/highlight/igtv/profile_pic are POST-MVP (require login)"
        author: { type: string, nullable: true }
        authorDisplayName: { type: string, nullable: true }
        authorAvatarUrl: { type: string, format: uri, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        caption: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: number, nullable: true }
        formats:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/MediaFormat" }
          description: "Present for post/reel; null for carousel (use items instead)"
        items:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/CarouselItem" }
          description: "Present only for type=carousel"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_URL
                - LOGIN_REQUIRED
                - NOT_FOUND
                - RATE_LIMITED
                - EXTRACTION_FAILED
                - UNSUPPORTED_TYPE
              description: >
                LOGIN_REQUIRED is a normal v1 outcome for gated content, not a
                failure — the Android client must render it with the specific
                copy in UI_UX_DESIGN.md §4.8, not a generic error toast.
            message:
              type: string
              example: "This content needs a logged-in session — not supported yet."
